<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smartscroll</title>
<meta name="description" content="Scroll and get smarter: world news, history and knowledge in short, narrated swipes, with quizzes.">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smartscroll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* One dark "screen" world like a video app. Accent: electric lime for learning moments, coral for likes. */
:root{
  --bg:#07080c; --ink:#f4f5f7; --ink-dim:rgba(244,245,247,.74); --ink-faint:rgba(244,245,247,.5);
  --glass:rgba(16,18,26,.55); --line:rgba(255,255,255,.16);
  --lime:#c8f560; --lime-ink:#141a05; --coral:#ff5d6c; --sky:#7cc4ff; --amber:#ffc65c;
  --ok:#4fe39a; --bad:#ff6b6b;
  --f-display:"Unbounded",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Familjen Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
a{color:inherit}

/* feed */
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-2;background:#111}
.bg .blur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.2);transform:scale(1.1)}
.bg .pic{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:var(--ox,50%) var(--oy,40%)}
.slide.playing .bg .pic{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.18) translate(var(--dx,-2%),var(--dy,1.5%))}}
.bg .pic.contain{background-size:contain;background-repeat:no-repeat;background-position:center 34%}
.bg .grad{position:absolute;inset:0;background:var(--g)}
.slide.playing .bg .grad{animation:hue 14s linear infinite}
@keyframes hue{to{filter:hue-rotate(60deg)}}
.bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 78%,rgba(0,0,0,.92) 100%)}
.bigword{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:80px;top:22%;font:800 clamp(34px,10vw,64px)/1.02 var(--f-display);letter-spacing:-.03em;color:rgba(255,255,255,.92);text-wrap:balance;overflow-wrap:anywhere}
.bigword small{display:block;font:600 14px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}

/* text overlay */
.meta{position:absolute;left:0;right:76px;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 26px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tag.news{color:var(--coral)} .tag.history{color:var(--amber)} .tag.trend{color:var(--sky)} .tag.deep,.tag.fact,.tag.photo{color:var(--lime)}
.meta h2{margin:0;font:700 25px/1.12 var(--f-body);letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.cap{margin:0;font-size:16px;line-height:1.42;color:var(--ink-dim);text-shadow:0 1px 8px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.slide.open .cap{-webkit-line-clamp:unset;max-height:42vh;overflow-y:auto}
.cap .w.on{color:var(--ink);background:rgba(200,245,96,.22);border-radius:3px}
.more{align-self:flex-start;font-weight:700;color:var(--ink);font-size:14px}
.src{font-size:12px;color:var(--ink-faint)}
.src a{text-decoration:underline}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:0;background:var(--lime)}

/* side actions */
.side{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;align-items:center;gap:18px;width:60px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--f-body);color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.act .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.act svg{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.act.liked svg{fill:var(--coral);stroke:var(--coral)}
.act.saved svg{fill:var(--lime);stroke:var(--lime)}
.act.pop .ic{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.heart-burst{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:burst .8s ease forwards;z-index:5}
.heart-burst svg{width:100%;height:100%;fill:var(--coral)}
@keyframes burst{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1) translateY(-60px);opacity:0}}

/* quiz */
.slide.quiz .bg{background:radial-gradient(120% 80% at 80% 0%,#2a3a10 0%,#0b0e06 55%,#07080c 100%)}
.qwrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 70px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(20px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.qlabel{font:800 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.qtext{font:700 23px/1.25 var(--f-body);text-wrap:balance}
.qimg{width:100%;max-height:26vh;object-fit:cover;border-radius:16px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px;font-weight:600;transition:background .2s,border-color .2s}
.opt:active{transform:scale(.99)}
.opt.right{background:rgba(79,227,154,.18);border-color:var(--ok)}
.opt.wrong{background:rgba(255,107,107,.16);border-color:var(--bad)}
.qres{min-height:48px;font-size:15px;color:var(--ink-dim)}
.qres b{color:var(--ink)}
.qhint{font-size:13px;color:var(--ink-faint);text-align:center}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
.top > *{pointer-events:auto}
.tabs{flex:1;display:flex;justify-content:center;gap:18px}
.tabs button{font:700 16px var(--f-body);color:var(--ink-faint);padding:6px 0;position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:2px;background:var(--ink)}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:700 13px var(--f-body);min-width:0}
.pill svg{width:16px;height:16px;flex:none}
#sound{width:38px;height:38px;justify-content:center;padding:0}

/* sheets & overlays */
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 64px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(18px,env(safe-area-inset-left,0px))}
.screen .in{max-width:560px;margin:0 auto}
.screen h1{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 6px}
.screen p.lead{color:var(--ink-dim);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-faint)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;overflow:hidden;background:#1a1c24 center/cover;text-align:left}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;font-weight:700;font-size:14px;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.empty{color:var(--ink-faint);text-align:center;padding:40px 0}

#start{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:0 max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 36px) max(22px,env(safe-area-inset-left,0px));
  background:radial-gradient(90% 60% at 20% 15%,rgba(200,245,96,.28),transparent 60%),radial-gradient(80% 50% at 90% 40%,rgba(124,196,255,.22),transparent 60%),var(--bg)}
#start h1{font:800 clamp(40px,12vw,72px)/.98 var(--f-display);letter-spacing:-.04em;margin:0}
#start h1 em{font-style:normal;color:var(--lime)}
#start p{color:var(--ink-dim);font-size:17px;margin:0;max-width:34ch}
.cta{width:100%;max-width:520px;padding:17px;border-radius:16px;background:var(--lime);color:var(--lime-ink);font:800 17px var(--f-body)}
.ghost{width:100%;max-width:520px;padding:12px;border-radius:14px;color:var(--ink-dim);font-weight:600}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:1;color:var(--ink-faint)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:70;background:rgba(20,22,30,.92);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));z-index:45;width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
@media (min-width:700px){.slide .meta{right:auto;width:min(560px,calc(100% - 100px))}.side{right:max(24px,calc(50% - 330px))}.slide .meta{left:max(24px,calc(50% - 330px));padding-left:0}.bigword{left:max(24px,calc(50% - 330px))}}
@media (prefers-reduced-motion: reduce){.slide.playing .bg .pic,.slide.playing .bg .grad{animation:none}.heart-burst{animation-duration:.01s}}
</style>
</head>
<body>
<div id="feed" aria-label="Feed"></div>
<div class="loading" id="loading">Loading today's world…</div>

<div class="top">
  <button class="pill" id="streakBtn" aria-label="Your progress"><svg viewBox="0 0 24 24" fill="#ffc65c" aria-hidden="true"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3-1-3 0-6 1-9z"/></svg><span id="streak">0</span></button>
  <nav class="tabs" role="tablist" aria-label="Feeds">
    <button role="tab" data-feed="all" aria-selected="true">For you</button>
    <button role="tab" data-feed="news" aria-selected="false">News</button>
    <button role="tab" data-feed="saved" aria-selected="false">Saved</button>
  </nav>
  <button class="pill" id="sound" aria-label="Narration on" aria-pressed="true"></button>
</div>

<div class="screen" id="screen" hidden></div>
<button class="close" id="closeScreen" hidden aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<div id="start" hidden>
  <h1>Scroll.<br>Get <em>smarter.</em></h1>
  <p>World news, history and big ideas in short swipes that read themselves to you. Every few swipes, a quick quiz.</p>
  <button class="cta" id="go">Start with sound</button>
  <button class="ghost" id="goMuted">Start muted</button>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
"use strict";
const API = "https://en.wikipedia.org/api/rest_v1";
const QUIZ_EVERY = 5;
const MAX_CHARS = 420;
const BLOCK = /porn|xxx|onlyfans|hentai|sex(ual)? (position|act)|nude|erotic/i;
const SKIP_TITLES = /^(Main_Page|Special:|Wikipedia:|File:|Portal:|Help:|Template:|Category:)/;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ss." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ss." + k, JSON.stringify(v)); } catch {} },
};
const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function trimText(t, max = MAX_CHARS) {
  t = (t || "").replace(/\s+/g, " ").trim();
  if (t.length <= max) return t;
  const cut = t.slice(0, max), dot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  return dot > max * 0.45 ? cut.slice(0, dot + 1) : cut.replace(/\s+\S*$/, "") + "…";
}
const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
const dayKey = d => d.toISOString().slice(0, 10);
const ymd = d => `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")}`;
const GRADS = [
  "linear-gradient(160deg,#1b2a6b,#0b0f24 60%,#3a0f3f)", "linear-gradient(160deg,#0f4c45,#07161b 60%,#21340b)",
  "linear-gradient(160deg,#5a1f12,#140808 60%,#3d2a07)", "linear-gradient(160deg,#30115e,#0b0716 60%,#0f3550)",
];
async function getJSON(url) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 12000);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; } return await r.json(); }
  finally { clearTimeout(t); }
}

/* ---------- state ---------- */
const S = {
  cards: [], seen: new Set(), filter: "all", loadingMore: false, dayCursor: null, sinceQuiz: 0,
  liked: store.get("liked", {}), saved: store.get("saved", {}), sound: store.get("sound", true), started: false,
  progress: store.get("progress", { days: {}, streak: 0, last: "", answered: 0, correct: 0, learned: 0 }),
  active: null, quizPool: [],
};

/* ---------- turning Wikipedia into cards ---------- */
function okPage(p) {
  if (!p || !p.titles) return false;
  const t = p.titles.canonical || p.title || "";
  if (SKIP_TITLES.test(t) || BLOCK.test(t) || BLOCK.test(p.extract || "") || BLOCK.test(p.description || "")) return false;
  return p.type !== "disambiguation" && (p.extract || "").length > 80;
}
function fromPage(p, kind, extra = {}) {
  const title = p.titles?.normalized || p.title;
  return {
    id: kind + ":" + (p.titles?.canonical || title) + (extra.idSuffix || ""),
    kind, title, desc: p.description || "",
    text: trimText(p.extract), img: p.originalimage?.source || p.thumbnail?.source || "",
    thumb: p.thumbnail?.source || "", url: p.content_urls?.mobile?.page || p.content_urls?.desktop?.page || "",
    imgW: p.originalimage?.width || p.thumbnail?.width || 0, imgH: p.originalimage?.height || p.thumbnail?.height || 0,
    ...extra,
  };
}
const LABEL = { news: "World news", history: "On this day", trend: "Trending", deep: "Deep dive", fact: "Did you know", photo: "Picture of the day" };

function buildDay(feed, date, isToday) {
  const news = [], rest = [];
  (feed.news || []).forEach((n, i) => {
    const story = stripHtml(n.story);
    const pages = (n.links || []).filter(okPage);
    if (!story || !pages.length || BLOCK.test(story)) return;
    // the most specific link is usually the one with the longest extract among the first few
    const main = pages.slice(0, 4).sort((a, b) => (b.extract || "").length - (a.extract || "").length)[0];
    const c = fromPage(main, "news", { idSuffix: "@" + dayKey(date) + "#" + i });
    c.title = story.length > 140 ? trimText(story, 140) : story;
    c.headline = story;
    c.text = trimText(story + " " + (main.extract || ""));
    c.topic = main.titles?.normalized || main.title;
    c.links = pages.map(p => p.titles?.normalized || p.title);
    news.push(c);
  });
  (feed.onthisday || []).slice(0, 8).forEach((o, i) => {
    const p = (o.pages || []).filter(okPage).sort((a, b) => (b.originalimage ? 1 : 0) - (a.originalimage ? 1 : 0))[0];
    if (!p || !o.text || BLOCK.test(o.text)) return;
    const c = fromPage(p, "history", { idSuffix: "@" + o.year + "#" + i });
    c.year = o.year; c.event = o.text;
    c.title = `${o.year}: ${trimText(o.text, 150)}`;
    c.text = trimText(`On this day in ${o.year}, ${o.text.charAt(0).toLowerCase() + o.text.slice(1)} ${p.extract}`);
    rest.push(c);
  });
  (feed.mostread?.articles || []).filter(okPage).slice(0, 10).forEach(a => {
    const c = fromPage(a, "trend"); c.views = a.views || 0; rest.push(c);
  });
  if (feed.tfa && okPage(feed.tfa)) rest.push(fromPage(feed.tfa, "deep", { text: trimText(feed.tfa.extract, 600) }));
  if (feed.image?.image?.source) {
    const im = feed.image, d = stripHtml(im.description?.html || im.description?.text || "");
    if (d && !BLOCK.test(d)) rest.push({
      id: "photo:" + im.title, kind: "photo", title: trimText(d, 120), text: trimText(d),
      img: im.image.source, thumb: im.thumbnail?.source || im.image.source, imgW: im.image.width, imgH: im.image.height,
      url: im.file_page || "https://commons.wikimedia.org/wiki/" + encodeURIComponent(im.title || ""),
      credit: stripHtml(im.artist?.html || im.artist?.text || ""),
    });
  }
  shuffle(rest);
  // today: news first, then mixed. older days: news spread through the mix
  if (isToday) return [...news, ...rest];
  const out = [...rest]; news.forEach((n, i) => out.splice(Math.min(out.length, i * 3), 0, n)); return out;
}

async function loadDay() {
  const d = S.dayCursor;
  try {
    const feed = await getJSON(`${API}/feed/featured/${ymd(d)}`);
    const isToday = !S.cards.length;
    S.dayCursor = new Date(d.getTime() - 864e5);
    const cards = buildDay(feed, d, isToday);
    if (!cards.length && isToday) return loadDay();
    return cards;
  } catch (e) {
    S.dayCursor = new Date(d.getTime() - 864e5);
    if (e.status === 404 && !S.cards.length) return loadDay(); // today's feed not published yet
    throw e;
  }
}
async function loadRandom(n = 6) {
  const out = [];
  for (let tries = 0; out.length < n && tries < n * 3; tries++) {
    try {
      const p = await getJSON(`${API}/page/random/summary`);
      if (okPage(p) && (p.extract || "").length > 220 && p.thumbnail && !S.seen.has("fact:" + (p.titles?.canonical || p.title))) out.push(fromPage(p, "fact"));
    } catch { await sleep(400); }
  }
  return out;
}

/* ---------- quizzes ---------- */
function makeQuiz() {
  const pool = S.quizPool.filter(c => !c.quizzed);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const hist = pool.filter(c => c.kind === "history" && c.year);
  const withDesc = S.quizPool.filter(c => c.desc && c.kind !== "news" && c.kind !== "photo");
  const news = pool.filter(c => c.kind === "news" && c.links?.length);
  const types = [];
  if (hist.length) types.push("year");
  if (withDesc.length >= 4 && pool.some(c => c.desc && c.kind !== "news" && c.kind !== "photo")) types.push("desc");
  if (news.length) types.push("news");
  if (!types.length) return null;
  const type = pick(types);
  if (type === "year") {
    const c = pick(hist); c.quizzed = true;
    const y = +c.year, opts = new Set([y]);
    const spread = Math.abs(2026 - y) > 300 ? 60 : Math.abs(2026 - y) > 80 ? 20 : 6;
    while (opts.size < 4) { const v = y + Math.round((Math.random() * 2 - 1) * spread) || y + 1; if (v !== y && v <= 2026 && v > 0) opts.add(v); }
    return { id: "quiz:" + c.id, kind: "quiz", q: `In which year did this happen? “${trimText(c.event, 160)}”`, img: c.thumb,
      opts: shuffle([...opts]).map(String), answer: String(y), explain: `It happened in ${y}.`, src: c };
  }
  if (type === "desc") {
    const c = pick(pool.filter(x => x.desc && x.kind !== "news" && x.kind !== "photo")); c.quizzed = true;
    const others = shuffle(withDesc.filter(x => x.title !== c.title && x.desc !== c.desc)).slice(0, 3).map(x => x.title);
    if (others.length < 3) return null;
    return { id: "quiz:" + c.id, kind: "quiz", q: `Which one is “${c.desc}”?`, opts: shuffle([c.title, ...others]), answer: c.title,
      explain: `${c.title}: ${trimText(c.text, 140)}`, src: c };
  }
  const c = pick(news); c.quizzed = true;
  const answer = c.topic;
  const distract = shuffle(S.quizPool.filter(x => x.kind !== "news" && x.title !== answer && x.title.length < 50).map(x => x.title)).slice(0, 3);
  if (distract.length < 3) return null;
  return { id: "quiz:" + c.id, kind: "quiz", q: `Today's news: “${trimText(c.headline, 170)}” Which topic is this story about?`, img: c.thumb,
    opts: shuffle([answer, ...distract]), answer, explain: `${answer}: ${trimText(c.text.replace(c.headline, ""), 140)}`, src: c };
}

/* ---------- rendering ---------- */
const ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 5.6 5 5 0 0 1 21.2 11C19 15.6 12 20 12 20z"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l7 7-7 7"/><path d="M21 11H11a8 8 0 0 0-8 8"/></svg>',
  read: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></svg>',
  on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
};
function slideHTML(c, i) {
  if (c.kind === "quiz") return `<section class="slide quiz" data-i="${i}" aria-label="Quiz">
    <div class="bg"></div>
    <div class="qwrap">
      <div class="qlabel">Quick quiz</div>
      ${c.img ? `<img class="qimg" src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
      <div class="qtext">${esc(c.q)}</div>
      <div class="opts">${c.opts.map(o => `<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div class="qres" aria-live="polite">${c.done ? resultHTML(c) : ""}</div>
      <div class="qhint">Swipe up to skip</div>
    </div></section>`;
  const wide = c.imgW && c.imgH && c.imgW / c.imgH > 1.25;
  const bg = c.img
    ? `<div class="blur" style="background-image:url('${esc(c.img)}')"></div><div class="pic${wide ? " contain" : ""}" style="background-image:url('${esc(c.img)}');--dx:${(Math.random() * 6 - 3).toFixed(1)}%;--dy:${(Math.random() * 4 - 2).toFixed(1)}%"></div>`
    : `<div class="grad" style="--g:${GRADS[i % GRADS.length]}"></div>`;
  const label = c.kind === "history" ? `${LABEL.history} · ${esc(c.year)}` : c.kind === "trend" ? `${LABEL.trend} · ${fmtNum(c.views)} reads` : LABEL[c.kind];
  return `<section class="slide" data-i="${i}" aria-label="${esc(c.title)}">
    <div class="bg">${bg}<div class="shade"></div></div>
    ${!c.img ? `<div class="bigword"><small>${esc(LABEL[c.kind])}</small>${esc(c.topic || c.title.split(":").pop().trim().slice(0, 60))}</div>` : ""}
    <div class="meta">
      <span class="tag ${c.kind}">${label}</span>
      <h2>${esc(c.kind === "trend" || c.kind === "deep" || c.kind === "fact" ? c.title : c.kind === "photo" ? "Picture of the day" : c.title)}</h2>
      <p class="cap">${captionHTML(c)}</p>
      <button class="more" data-more>more</button>
      <div class="src">${c.credit ? esc(trimText(c.credit, 60)) + " · " : ""}<a href="${esc(c.url)}" target="_blank" rel="noopener">Wikipedia</a> · CC BY-SA</div>
    </div>
    <div class="side">
      <button class="act${S.liked[c.id] ? " liked" : ""}" data-act="like" aria-label="Like"><span class="ic">${ICON.heart}</span><span>${S.liked[c.id] ? "Liked" : "Like"}</span></button>
      <button class="act${S.saved[c.id] ? " saved" : ""}" data-act="save" aria-label="Save"><span class="ic">${ICON.save}</span><span>${S.saved[c.id] ? "Saved" : "Save"}</span></button>
      <button class="act" data-act="share" aria-label="Share"><span class="ic">${ICON.share}</span><span>Share</span></button>
      <a class="act" href="${esc(c.url)}" target="_blank" rel="noopener" aria-label="Read the full article"><span class="ic">${ICON.read}</span><span>Read</span></a>
    </div>
    <div class="bar"><i></i></div>
  </section>`;
}
function captionHTML(c) {
  const t = c.kind === "news" ? c.text.replace(c.headline, "").trim() || c.text : c.text;
  return t.split(/(\s+)/).map((w, k) => (/\s/.test(w) ? w : `<span class="w" data-k="${k}">${esc(w)}</span>`)).join("");
}
function resultHTML(c) {
  return c.correct ? `<b style="color:var(--ok)">Correct!</b> ${esc(c.explain)}` : `<b style="color:var(--bad)">Not quite.</b> ${esc(c.explain)}`;
}
function visibleCards() {
  if (S.filter === "news") return S.cards.filter(c => c.kind === "news" || c.kind === "quiz" && c.src?.kind === "news");
  if (S.filter === "saved") return S.cards.filter(c => S.saved[c.id]);
  return S.cards;
}
let rendered = 0;
function renderFeed(reset) {
  const feed = $("#feed"), list = visibleCards();
  if (reset) { feed.innerHTML = ""; rendered = 0; feed.scrollTop = 0; }
  if (S.filter === "saved" && !list.length) {
    feed.innerHTML = `<section class="slide"><div class="bg"><div class="grad" style="--g:${GRADS[3]}"></div></div><div class="qwrap"><div class="qlabel">Saved</div><div class="qtext">Nothing saved yet.</div><p style="color:var(--ink-dim)">Tap the bookmark on any card to keep it here.</p></div></section>`;
    return;
  }
  const frag = list.slice(rendered).map((c, k) => slideHTML(c, S.cards.indexOf(c))).join("");
  feed.insertAdjacentHTML("beforeend", frag);
  feed.querySelectorAll(".slide:not([data-obs])").forEach(el => { el.dataset.obs = 1; io.observe(el); });
  rendered = list.length;
}
function appendCards(cards) {
  for (const c of cards) {
    if (S.seen.has(c.id)) continue;
    S.seen.add(c.id); S.cards.push(c);
    if (c.kind !== "quiz") { S.quizPool.push(c); S.sinceQuiz++; }
    if (S.sinceQuiz >= QUIZ_EVERY) { const q = makeQuiz(); if (q && !S.seen.has(q.id)) { S.seen.add(q.id); S.cards.push(q); S.sinceQuiz = 0; } }
  }
  if (S.filter !== "saved") renderFeed(false);
}
async function loadMore() {
  if (S.loadingMore) return;
  S.loadingMore = true;
  try {
    let cards = [];
    try { cards = await loadDay(); } catch { cards = []; }
    if (cards.length < 4) cards = cards.concat(await loadRandom(6));
    if (!cards.length && !S.cards.length) throw new Error("offline");
    appendCards(cards);
    $("#loading").hidden = true;
  } catch {
    $("#loading").textContent = "Couldn't reach the news. Check your connection and pull to refresh.";
  } finally { S.loadingMore = false; }
}

/* ---------- playback: narration + highlight ---------- */
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  voice = vs.find(v => /Samantha|Daniel|Karen|Google US English|Google UK English Female|Aria|Jenny|Guy/i.test(v.name) && v.localService !== false)
    || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
let speakToken = 0, barTimer = 0;
function stopPlayback() {
  speakToken++;
  if (synth) synth.cancel();
  clearInterval(barTimer);
  document.querySelectorAll(".w.on").forEach(w => w.classList.remove("on"));
}
function play(slide) {
  stopPlayback();
  document.querySelectorAll(".slide.playing").forEach(s => s !== slide && s.classList.remove("playing"));
  if (!slide) return;
  slide.classList.add("playing");
  const c = S.cards[+slide.dataset.i];
  if (!c || c.kind === "quiz") { if (c?.kind === "quiz" && S.sound && S.started && !c.done) speak(c.q, null, null); return; }
  countLearned(c);
  const bar = slide.querySelector(".bar i");
  const spoken = c.kind === "news" ? c.text : c.kind === "history" ? c.text : `${c.title}. ${c.text}`;
  if (S.sound && S.started && synth) speak(spoken, slide, bar);
  else { // silent: progress bar by reading time
    const dur = Math.max(6000, spoken.split(/\s+/).length * 330), t0 = Date.now();
    barTimer = setInterval(() => { const p = Math.min(1, (Date.now() - t0) / dur); if (bar) bar.style.width = p * 100 + "%"; if (p >= 1) clearInterval(barTimer); }, 120);
  }
}
function speak(text, slide, bar) {
  const tok = ++speakToken;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice?.lang || "en-US"; u.rate = 1.04; u.pitch = 1;
  const words = slide ? [...slide.querySelectorAll(".cap .w")] : [];
  const capText = slide ? slide.querySelector(".cap").textContent : "";
  const offset = Math.max(0, text.indexOf(capText.slice(0, 30)));
  // map char index -> caption word
  const starts = []; if (words.length) { let pos = 0; words.forEach(w => { const at = capText.indexOf(w.textContent, pos); starts.push(at); pos = at + w.textContent.length; }); }
  let lastOn = null;
  u.onboundary = e => {
    if (tok !== speakToken) return;
    if (bar) bar.style.width = Math.min(100, (e.charIndex / text.length) * 100) + "%";
    if (!words.length) return;
    const ci = e.charIndex - offset; if (ci < 0) return;
    let k = 0; while (k + 1 < starts.length && starts[k + 1] <= ci) k++;
    if (lastOn) lastOn.classList.remove("on");
    lastOn = words[k]; if (lastOn) lastOn.classList.add("on");
  };
  u.onend = () => { if (tok !== speakToken) return; if (bar) bar.style.width = "100%"; if (lastOn) lastOn.classList.remove("on"); };
  synth.speak(u);
}

/* ---------- progress (streak, learned) ---------- */
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function countLearned(c) {
  const P = S.progress, k = todayKey();
  if (!P.days[k]) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yk = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
    P.streak = P.last === yk ? P.streak + 1 : 1; P.last = k; P.days[k] = { learned: 0, seen: [] };
    const keys = Object.keys(P.days); if (keys.length > 60) delete P.days[keys[0]];
  }
  if (!P.days[k].seen.includes(c.id)) { P.days[k].seen.push(c.id); P.days[k].learned++; P.learned++; if (P.days[k].seen.length > 400) P.days[k].seen.shift(); }
  store.set("progress", P); $("#streak").textContent = P.streak;
}
function showProgress() {
  const P = S.progress, today = P.days[todayKey()]?.learned || 0;
  const acc = P.answered ? Math.round((P.correct / P.answered) * 100) + "%" : "–";
  const savedCards = S.cards.filter(c => S.saved[c.id]);
  const savedOld = Object.values(S.saved).filter(v => typeof v === "object" && !S.cards.some(c => c.id === v.id));
  const items = [...savedCards.map(c => ({ id: c.id, title: c.title, thumb: c.thumb, url: c.url })), ...savedOld];
  openScreen(`<h1>Your progress</h1><p class="lead">Small daily swipes add up.</p>
    <div class="stats">
      <div class="stat"><b>${P.streak}</b><span>day streak</span></div>
      <div class="stat"><b>${today}</b><span>learned today</span></div>
      <div class="stat"><b>${acc}</b><span>quiz score</span></div>
    </div>
    <h1 style="font-size:18px;margin-bottom:10px">Saved</h1>
    ${items.length ? `<div class="grid">${items.map(s => `<a class="tile" href="${esc(s.url)}" target="_blank" rel="noopener" style="background-image:url('${esc(s.thumb || "")}')"><span>${esc(trimText(s.title, 70))}</span></a>`).join("")}</div>`
      : `<div class="empty">Tap the bookmark on any card to keep it here.</div>`}
    <p class="lead" style="margin-top:24px;font-size:13px">Content from Wikipedia and Wikimedia Commons under CC BY-SA. Tap “Read” on any card for the full article and its sources.</p>`);
}
function openScreen(html) { stopPlayback(); $("#screen").innerHTML = `<div class="in">${html}</div>`; $("#screen").hidden = false; $("#closeScreen").hidden = false; history.pushState({ screen: 1 }, ""); }
function closeScreen() { $("#screen").hidden = true; $("#closeScreen").hidden = true; play(currentSlide()); }

/* ---------- actions ---------- */
let toastT = 0;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function setSound(on) {
  S.sound = on; store.set("sound", on);
  const b = $("#sound"); b.innerHTML = on ? ICON.on : ICON.off; b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Narration on" : "Narration off");
  if (!on) stopPlayback(); else play(currentSlide());
}
function like(slide, c, burstAt) {
  const btn = slide.querySelector('[data-act="like"]');
  if (!S.liked[c.id] || burstAt) { S.liked[c.id] = 1; } else delete S.liked[c.id];
  store.set("liked", S.liked);
  btn.classList.toggle("liked", !!S.liked[c.id]); btn.lastElementChild.textContent = S.liked[c.id] ? "Liked" : "Like";
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  if (burstAt) {
    const h = document.createElement("div"); h.className = "heart-burst"; h.style.left = burstAt.x + "px"; h.style.top = burstAt.y + "px";
    h.innerHTML = ICON.heart; slide.appendChild(h); setTimeout(() => h.remove(), 850);
  }
}
async function share(c) {
  const data = { title: c.title, text: trimText(c.title, 120) + " (via Smartscroll)", url: c.url };
  try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(c.url); toast("Link copied"); } catch { toast(c.url); }
}
function answer(slide, c, opt) {
  if (c.done) return;
  c.done = true; c.correct = opt === c.answer;
  S.progress.answered++; if (c.correct) S.progress.correct++; store.set("progress", S.progress);
  slide.querySelectorAll(".opt").forEach(b => {
    if (b.dataset.opt === c.answer) b.classList.add("right");
    else if (b.dataset.opt === opt) b.classList.add("wrong");
    b.disabled = true;
  });
  slide.querySelector(".qres").innerHTML = resultHTML(c);
  if (S.sound && S.started && synth) speak((c.correct ? "Correct! " : "Not quite. ") + c.explain, null, null);
  if (navigator.vibrate) navigator.vibrate(c.correct ? 30 : [40, 60, 40]);
}

/* ---------- events ---------- */
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting && e.intersectionRatio > 0.6) {
      S.active = e.target; if (S.started && $("#screen").hidden) play(e.target);
      const i = [...e.target.parentNode.children].indexOf(e.target);
      if (S.filter !== "saved" && rendered - i < 6) loadMore();
    }
  }
}, { root: $("#feed"), threshold: [0.6] });
const currentSlide = () => S.active;

let lastTap = 0;
$("#feed").addEventListener("click", e => {
  const slide = e.target.closest(".slide"); if (!slide) return;
  const c = S.cards[+slide.dataset.i];
  const opt = e.target.closest(".opt"); if (opt && c) { answer(slide, c, opt.dataset.opt); return; }
  const act = e.target.closest("[data-act]");
  if (act && c) { if (act.dataset.act === "like") like(slide, c); if (act.dataset.act === "save") {
      if (S.saved[c.id]) delete S.saved[c.id]; else S.saved[c.id] = { id: c.id, title: c.title, thumb: c.thumb, url: c.url };
      store.set("saved", S.saved); act.classList.toggle("saved", !!S.saved[c.id]); act.lastElementChild.textContent = S.saved[c.id] ? "Saved" : "Save";
      toast(S.saved[c.id] ? "Saved" : "Removed from saved"); }
    if (act.dataset.act === "share") share(c); return; }
  if (e.target.closest("[data-more]")) { slide.classList.toggle("open"); e.target.textContent = slide.classList.contains("open") ? "less" : "more"; return; }
  if (e.target.closest("a")) return;
  if (!c || c.kind === "quiz") return;
  const now = Date.now();
  if (now - lastTap < 320) { like(slide, c, { x: e.clientX, y: e.clientY }); lastTap = 0; return; }
  lastTap = now;
  // single tap: pause / resume narration
  setTimeout(() => { if (lastTap === now) { if (synth?.speaking && !synth.paused) { synth.pause(); toast("Paused"); } else if (synth?.paused) { synth.resume(); } else play(slide); } }, 330);
});
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  S.filter = b.dataset.feed;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  stopPlayback(); renderFeed(true);
}));
$("#sound").addEventListener("click", () => setSound(!S.sound));
$("#streakBtn").addEventListener("click", showProgress);
$("#closeScreen").addEventListener("click", () => history.back());
window.addEventListener("popstate", () => { if (!$("#screen").hidden) closeScreen(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) stopPlayback(); });
document.addEventListener("keydown", e => {
  if (!$("#screen").hidden) { if (e.key === "Escape") history.back(); return; }
  const f = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { f.scrollBy({ top: f.clientHeight, behavior: "smooth" }); e.preventDefault(); }
  if (e.key === "ArrowUp" || e.key === "k") { f.scrollBy({ top: -f.clientHeight, behavior: "smooth" }); e.preventDefault(); }
});
function begin(withSound) {
  S.started = true; $("#start").hidden = true; store.set("onboarded", true);
  if (withSound && synth) { // unlock speech on iOS inside the tap
    const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u);
  }
  setSound(withSound && !!synth);
}
$("#go").addEventListener("click", () => begin(true));
$("#goMuted").addEventListener("click", () => begin(false));

/* ---------- boot ---------- */
$("#streak").textContent = S.progress.last === todayKey() || (() => { const y = new Date(); y.setDate(y.getDate() - 1); return S.progress.last === `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`; })() ? S.progress.streak : 0;
$("#sound").innerHTML = S.sound ? ICON.on : ICON.off;
$("#start").hidden = false; // speech needs one tap on every visit (browser rule)
if (store.get("onboarded", false)) { $("#go").textContent = "Continue with sound"; $("#goMuted").textContent = "Continue muted"; }
S.dayCursor = new Date();
loadMore();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
